services:
  aerpaw-sionna-api:
    build:
      context: .
      network: host
      dockerfile: Dockerfile
    container_name: aerpaw-sionna-api
    gpus: all
    cap_add:
      - NET_ADMIN
    volumes:
      - ./src:/app/src
      - ./test:/app/test
      - ./data:/app/data          
    environment:
      - PYTHONPATH=/app/src
      - SCENE_CONFIG=${SCENE_CONFIG:-aerpaw}
      # Leave SCENE_PATH unset so the preset's path is used
      # - SCENE_PATH=
      - MI_VARIANT=${MI_VARIANT:-cuda_ad_mono_polarized}
      - SIONNA_MERGE_SHAPES=${SIONNA_MERGE_SHAPES:-true}
    restart: unless-stopped
